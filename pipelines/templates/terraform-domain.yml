# Template:

parameters:
  - name: environmentName
    type: string

  - name: domainName
    type: string

  - name: terraformWorkingDirectory
    type: string

  - name: serviceConnection
    type: string

  - name: backendResourceGroup
    type: string

  - name: backendStorageAccount
    type: string

  - name: backendContainer
    type: string
    default: tfstate

  - name: backendKey
    type: string

  - name: deploymentEnvironment
    type: string


stages:

  # ============================================================
  # PR VALIDATION
  # ============================================================

  - stage: PRValidation
    displayName: Terraform PR Validation
    condition: eq(variables['Build.Reason'], 'PullRequest')

    jobs:
      - job: TerraformValidation
        displayName: Terraform Validate and Plan

        steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.15.9'

          - powershell: |
              terraform fmt -check -recursive -diff
            displayName: Terraform Format Check
            workingDirectory: '$(Build.SourcesDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '${{ parameters.terraformWorkingDirectory }}'
              backendServiceArm: '${{ parameters.serviceConnection }}'
              backendAzureRmUseEntraIdForAuthentication: true
              backendAzureRmResourceGroupName: '${{ parameters.backendResourceGroup }}'
              backendAzureRmStorageAccountName: '${{ parameters.backendStorageAccount }}'
              backendAzureRmContainerName: '${{ parameters.backendContainer }}'
              backendAzureRmKey: '${{ parameters.backendKey }}'
              commandOptions: '-input=false'

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: azurerm
              command: validate
              workingDirectory: '${{ parameters.terraformWorkingDirectory }}'

          - powershell: |
              Write-Host "Running Checkov security scan..."
              checkov `
                -d "$(Build.SourcesDirectory)/${{ parameters.terraformWorkingDirectory }}" `
                --framework terraform `
                --quiet

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Checkov security scan reported failed checks. Review the failed checks above."
                Write-Host "Continuing pipeline execution."
                $global:LASTEXITCODE = 0
              }
            displayName: Run Checkov Security Scan

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: azurerm
              command: plan
              workingDirectory: '${{ parameters.terraformWorkingDirectory }}'
              environmentServiceNameAzureRM: '${{ parameters.serviceConnection }}'
              commandOptions: '-out=tfplan -input=false'

          - powershell: |
              terraform show -no-color tfplan | Out-File -FilePath tfplan.txt -Encoding utf8
            displayName: Generate Readable Terraform Plan
            workingDirectory: '${{ parameters.terraformWorkingDirectory }}'

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform PR Plan
            inputs:
              targetPath: '${{ parameters.terraformWorkingDirectory }}/tfplan'
              artifact: 'terraform-${{ parameters.environmentName }}-${{ parameters.domainName }}-pr-plan'
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: Publish Readable Terraform PR Plan
            inputs:
              targetPath: '${{ parameters.terraformWorkingDirectory }}/tfplan.txt'
              artifact: 'terraform-${{ parameters.environmentName }}-${{ parameters.domainName }}-pr-plan-readable'
              publishLocation: pipeline


  # ============================================================
  # MAIN BRANCH PLAN
  # ============================================================

  - stage: Plan
    displayName: Terraform Plan
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')

    jobs:
      - job: TerraformPlan
        displayName: Terraform Plan

        steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.15.9'

          - powershell: |
              terraform fmt -check -recursive -diff
            displayName: Terraform Format Check
            workingDirectory: '$(Build.SourcesDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '${{ parameters.terraformWorkingDirectory }}'
              backendServiceArm: '${{ parameters.serviceConnection }}'
              backendAzureRmUseEntraIdForAuthentication: true
              backendAzureRmResourceGroupName: '${{ parameters.backendResourceGroup }}'
              backendAzureRmStorageAccountName: '${{ parameters.backendStorageAccount }}'
              backendAzureRmContainerName: '${{ parameters.backendContainer }}'
              backendAzureRmKey: '${{ parameters.backendKey }}'
              commandOptions: '-input=false'

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: azurerm
              command: validate
              workingDirectory: '${{ parameters.terraformWorkingDirectory }}'

          - powershell: |
              Write-Host "Running Checkov security scan..."
              checkov `
                -d "$(Build.SourcesDirectory)/${{ parameters.terraformWorkingDirectory }}" `
                --framework terraform `
                --quiet

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Checkov security scan reported failed checks. Review the failed checks above."
                Write-Host "Continuing pipeline execution."
                $global:LASTEXITCODE = 0
              }
            displayName: Run Checkov Security Scan

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: azurerm
              command: plan
              workingDirectory: '${{ parameters.terraformWorkingDirectory }}'
              environmentServiceNameAzureRM: '${{ parameters.serviceConnection }}'
              commandOptions: '-out=tfplan -input=false'

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform Plan
            inputs:
              targetPath: '${{ parameters.terraformWorkingDirectory }}/tfplan'
              artifact: 'terraform-${{ parameters.environmentName }}-${{ parameters.domainName }}-plan'
              publishLocation: pipeline


  # ============================================================
  # APPLY
  # ============================================================

  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan

    condition: and(
      succeeded('Plan'),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    jobs:
      - deployment: TerraformApply
        displayName: Terraform Apply

        environment: '${{ parameters.deploymentEnvironment }}'

        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: '1.15.9'

                - task: DownloadPipelineArtifact@2
                  displayName: Download Terraform Plan
                  inputs:
                    artifact: 'terraform-${{ parameters.environmentName }}-${{ parameters.domainName }}-plan'
                    path: '${{ parameters.terraformWorkingDirectory }}'

                - task: TerraformTaskV4@4
                  displayName: Terraform Init
                  inputs:
                    provider: azurerm
                    command: init
                    workingDirectory: '${{ parameters.terraformWorkingDirectory }}'
                    backendServiceArm: '${{ parameters.serviceConnection }}'
                    backendAzureRmUseEntraIdForAuthentication: true
                    backendAzureRmResourceGroupName: '${{ parameters.backendResourceGroup }}'
                    backendAzureRmStorageAccountName: '${{ parameters.backendStorageAccount }}'
                    backendAzureRmContainerName: '${{ parameters.backendContainer }}'
                    backendAzureRmKey: '${{ parameters.backendKey }}'
                    commandOptions: '-input=false'

                - task: TerraformTaskV4@4
                  displayName: Terraform Apply
                  inputs:
                    provider: azurerm
                    command: apply
                    workingDirectory: '${{ parameters.terraformWorkingDirectory }}'
                    environmentServiceNameAzureRM: '${{ parameters.serviceConnection }}'
                    commandOptions: 'tfplan'