trigger:
  branches:
    include:
      - main

  paths:
    include:
      - bootstrap/terraform-state/*
      - pipelines/terraform-bootstrap.yml

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.15.9'
  environmentName: 'bootstrap'
  terraformWorkingDirectory: 'bootstrap/terraform-state'
  serviceConnection: 'sc-ealz-dev'

stages:
  - stage: Plan
    displayName: Terraform Bootstrap Plan

    jobs:
      - job: TerraformPlan
        displayName: Terraform Bootstrap Plan

        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-out=tfplan'

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform Plan
            inputs:
              targetPath: '$(terraformWorkingDirectory)/tfplan'
              artifact: 'terraform-bootstrap-plan'
              publishLocation: 'pipeline'

  - stage: Apply
    displayName: Terraform Bootstrap Apply
    dependsOn: Plan
    condition: succeeded()

    jobs:
      - deployment: TerraformApply
        displayName: Terraform Bootstrap Apply
        environment: 'bootstrap'

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: '$(terraformVersion)'

                - task: DownloadPipelineArtifact@2
                  displayName: Download Terraform Plan
                  inputs:
                    artifact: 'terraform-bootstrap-plan'
                    path: '$(terraformWorkingDirectory)'

                - task: TerraformTaskV4@4
                  displayName: Terraform Init
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(terraformWorkingDirectory)'

                - task: TerraformTaskV4@4
                  displayName: Terraform Apply
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(terraformWorkingDirectory)'
                    environmentServiceNameAzureRM: '$(serviceConnection)'
                    commandOptions: 'tfplan'