trigger:
  branches:
    include:
      - main

  paths:
    include:
      - bootstrap/terraform-state/*
      - pipelines/terraform-bootstrap.yml

pool:
  name: MultiOsPool
  demands:
    - Agent.Name -equals prod-win-vm-age

variables:
  terraformVersion: '1.15.9'
  terraformWorkingDirectory: 'bootstrap/terraform-state'
  serviceConnection: 'sc-ealz-dev'

  backendResourceGroupName: 'rg-ealz-tfstate-eus2-001'
  backendStorageAccountName: 'stealztfstate001'
  backendContainerName: 'tfstate'
  backendKey: 'bootstrap.tfstate'

stages:

  # TEMPORARY STAGE - Run only once
  - stage: MigrateState
    displayName: Migrate Bootstrap State

    jobs:
      - deployment: TerraformStateMigration
        displayName: Migrate Local State to Remote Backend
        environment: 'bootstrap'

        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self

                - task: DownloadSecureFile@1
                  name: DownloadBootstrapState
                  displayName: Download Bootstrap Terraform State
                  inputs:
                    secureFile: 'terraform.tfstate'

                - task: PowerShell@2
                  displayName: Copy Terraform State
                  inputs:
                    targetType: inline
                    workingDirectory: '$(System.DefaultWorkingDirectory)/$(terraformWorkingDirectory)'
                    script: |
                      Copy-Item `
                        "$(DownloadBootstrapState.secureFilePath)" `
                        "$(System.DefaultWorkingDirectory)/$(terraformWorkingDirectory)/terraform.tfstate" `
                        -Force

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: '$(terraformVersion)'

                - task: TerraformTaskV4@4
                  displayName: Migrate Terraform State
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(terraformWorkingDirectory)'
                    backendServiceArm: '$(serviceConnection)'
                    backendAzureRmResourceGroupName: '$(backendResourceGroupName)'
                    backendAzureRmStorageAccountName: '$(backendStorageAccountName)'
                    backendAzureRmContainerName: '$(backendContainerName)'
                    backendAzureRmKey: '$(backendKey)'
                    commandOptions: '-migrate-state -force-copy -input=false'

  - stage: Plan
    displayName: Terraform Bootstrap Plan
    dependsOn: MigrateState
    condition: succeeded()

    jobs:
      - job: TerraformPlan
        displayName: Terraform Bootstrap Plan

        steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(terraformWorkingDirectory)'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroupName)'
              backendAzureRmStorageAccountName: '$(backendStorageAccountName)'
              backendAzureRmContainerName: '$(backendContainerName)'
              backendAzureRmKey: '$(backendKey)'

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-out=tfplan'

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform Plan
            inputs:
              targetPath: '$(terraformWorkingDirectory)/tfplan'
              artifact: 'terraform-bootstrap-plan'
              publishLocation: 'pipeline'

  - stage: Apply
    displayName: Terraform Bootstrap Apply
    dependsOn: Plan
    condition: succeeded()

    jobs:
      - deployment: TerraformApply
        displayName: Terraform Bootstrap Apply
        environment: 'bootstrap'

        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: '$(terraformVersion)'

                - task: DownloadPipelineArtifact@2
                  displayName: Download Terraform Plan
                  inputs:
                    artifact: 'terraform-bootstrap-plan'
                    path: '$(terraformWorkingDirectory)'

                - task: TerraformTaskV4@4
                  displayName: Terraform Init
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(terraformWorkingDirectory)'
                    backendServiceArm: '$(serviceConnection)'
                    backendAzureRmResourceGroupName: '$(backendResourceGroupName)'
                    backendAzureRmStorageAccountName: '$(backendStorageAccountName)'
                    backendAzureRmContainerName: '$(backendContainerName)'
                    backendAzureRmKey: '$(backendKey)'

                - task: TerraformTaskV4@4
                  displayName: Terraform Apply
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(terraformWorkingDirectory)'
                    environmentServiceNameAzureRM: '$(serviceConnection)'
                    commandOptions: 'tfplan'