          - task: TerraformTaskV4@4
            displayName: Networking - Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: 'environments/dev/networking'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmUseEntraIdForAuthentication: true
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: 'dev-networking.tfstate'
              commandOptions: '-input=false'

          - task: TerraformTaskV4@4
            displayName: Networking - Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: 'environments/dev/networking'

          - task: TerraformTaskV4@4
            displayName: Networking - Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: 'environments/dev/networking'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-input=false -out=tfplan'

