            displayName: Install Terraform
            inputs:
              terraformVersion: '$(terraformVersion)'

          # --------------------------------------------------
          # Terraform formatting
          # --------------------------------------------------

          - powershell: |
              terraform fmt -check -recursive
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Terraform formatting check failed."
                exit 1
