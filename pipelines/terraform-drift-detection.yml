trigger: none

pr: none

schedules:
  - cron: "0 2 * * *"
    displayName: Daily Terraform Drift Detection
    branches:
      include:
        - main
    always: true

pool:
  name: MultiOsPool
  demands:
    - Agent.Name -equals prod-win-vm-age

variables:
  terraformVersion: '1.15.9'
  serviceConnection: 'sc-ealz-dev'

  backendResourceGroup: 'rg-ealz-tfstate-eus2-001'
  backendStorageAccount: 'stealztfstate001'
  backendContainer: 'tfstate'

stages:

# ============================================================
# RESOURCE GROUPS
# ============================================================

- stage: Drift_Resource_Groups
  displayName: Drift Detection - Resource Groups

  jobs:
    - job: Check_Resource_Groups
      displayName: Check Resource Groups Drift

      steps:
        - checkout: self

        - task: TerraformInstaller@1
          displayName: Install Terraform
          inputs:
            terraformVersion: $(terraformVersion)

        - task: AzureCLI@2
          displayName: Terraform Drift Check - Resource Groups
          inputs:
            azureSubscription: $(serviceConnection)
            scriptType: ps
            scriptLocation: inlineScript
            workingDirectory: '$(Build.SourcesDirectory)/environments/dev/resource-groups'
            powerShellErrorActionPreference: stop
            powerShellIgnoreLASTEXITCODE: true
            inlineScript: |
              Write-Host "=================================================="
              Write-Host "TERRAFORM DIAGNOSTICS"
              Write-Host "=================================================="

              Write-Host "Current working directory:"
              Get-Location

              Write-Host ""
              Write-Host "Terraform executable:"

              $terraformCommand = Get-Command terraform -ErrorAction Stop
              $terraformCommand | Format-List Name, Source, CommandType

              $terraform = $terraformCommand.Source

              if ([string]::IsNullOrWhiteSpace($terraform)) {
                  Write-Host "##vso[task.logissue type=error]Unable to resolve the Terraform executable."
                  exit 1
              }

              Write-Host ""
              Write-Host "Terraform executable resolved to:"
              Write-Host $terraform

              Write-Host ""
              Write-Host "Terraform version:"
              & $terraform version

              if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=error]Unable to execute Terraform."
                  exit $LASTEXITCODE
              }

              Write-Host ""
              Write-Host "Terraform-related environment variables BEFORE cleanup:"

              Get-ChildItem Env: |
                Where-Object {
                    $_.Name -like "TF_*" -or
                    $_.Name -like "TERRAFORM*"
                } |
                Sort-Object Name |
                Format-Table -AutoSize

              Write-Host ""
              Write-Host "Removing Terraform CLI argument injection variables."

              [Environment]::SetEnvironmentVariable(
                  "TF_CLI_ARGS",
                  $null,
                  [EnvironmentVariableTarget\]::Process
              )

              [Environment]::SetEnvironmentVariable(
                  "TF_CLI_ARGS_plan",
                  $null,
                  [EnvironmentVariableTarget\]::Process
              )

              Remove-Item Env:TF_CLI_ARGS -ErrorAction SilentlyContinue
              Remove-Item Env:TF_CLI_ARGS
   


# ============================================================
# IDENTITY
# ============================================================

- stage: Drift_Identity
  displayName: Drift Detection - Identity

  jobs:
    - job: Check_Identity
      displayName: Check Identity Drift

      steps:
        - checkout: self

        - task: TerraformInstaller@1
          displayName: Install Terraform
          inputs:
            terraformVersion: $(terraformVersion)

        - task: AzureCLI@2
          displayName: Terraform Drift Check - Identity
          inputs:
            azureSubscription: $(serviceConnection)
            scriptType: ps
            scriptLocation: inlineScript
            workingDirectory: '$(Build.SourcesDirectory)/environments/dev/identity'
            inlineScript: |
              $env:TF_CLI_ARGS = $null
              $env:TF_CLI_ARGS_plan = $null

              Write-Host "Working directory:"
              Get-Location

              terraform version

              terraform init `
                -backend-config="resource_group_name=$(backendResourceGroup)" `
                -backend-config="storage_account_name=$(backendStorageAccount)" `
                -backend-config="container_name=$(backendContainer)" `
                -backend-config="key=dev-identity.tfstate" `
                -input=false

              if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=error]Terraform init failed for Identity."
                  exit $LASTEXITCODE
              }

              terraform validate

              if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=error]Terraform validation failed for Identity."
                  exit $LASTEXITCODE
              }

              terraform plan `
                -input=false `
                -detailed-exitcode `
                -out=drift.tfplan

              $exitCode = $LASTEXITCODE

              Write-Host "Terraform plan exit code: $exitCode"

              if ($exitCode -eq 0) {
                  Write-Host "No drift detected for Identity."
                  exit 0
              }

              if ($exitCode -eq 2) {
                  Write-Host "##vso[task.logissue type=warning]Terraform drift detected for Identity."
                  exit 0
              }

              Write-Host "##vso[task.logissue type=error]Terraform plan failed for Identity."
              exit $exitCode


