trigger: none

pr: none

schedules:
  - cron: "0 2 * * *"
    displayName: Daily Terraform Drift Detection
    branches:
      include:
        - main
    always: true

pool:
  name: MultiOsPool
  demands:
    - Agent.Name -equals prod-win-vm-age

variables:
  terraformVersion: '1.15.9'
  serviceConnection: 'sc-ealz-dev'

  backendResourceGroup: 'rg-ealz-tfstate-eus2-001'
  backendStorageAccount: 'stealztfstate001'
  backendContainer: 'tfstate'

stages:

# ============================================================
# RESOURCE GROUPS
# ============================================================

- stage: Drift_Resource_Groups
  displayName: Drift Detection - Resource Groups

  jobs:
  - job: Check_Resource_Groups

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: $(terraformVersion)

    - task: AzureCLI@2
      displayName: Terraform Drift Check
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: ps
        scriptLocation: inlineScript
        workingDirectory: '$(Build.SourcesDirectory)/environments/dev/resource-groups'
        inlineScript: |

          terraform version

          terraform init `
            -backend-config="resource_group_name=$(backendResourceGroup)" `
            -backend-config="storage_account_name=$(backendStorageAccount)" `
            -backend-config="container_name=$(backendContainer)" `
            -backend-config="key=dev-resource-groups.tfstate" `
            -input=false

          terraform validate

          terraform plan -input=false -detailed-exitcode -out=drift.tfplan

          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
              Write-Host "No drift detected for Resource Groups."
              exit 0
          }

          if ($exitCode -eq 2) {
              Write-Host "##vso[task.logissue type=warning]Terraform drift detected for Resource Groups."
              exit 0
          }

          Write-Host "##vso[task.logissue type=error]Terraform plan failed for Resource Groups."
          exit $exitCode


