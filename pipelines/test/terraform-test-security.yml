trigger:
  branches:
    include:
      - main
  paths:
    include:
      - environments/test/security/**
      - modules/security/**
      - pipelines/test/terraform-test-security.yml

pr:
  autoCancel: true
  branches:
    include:
      - main
  paths:
    include:
      - environments/test/security/**
      - modules/security/**
      - pipelines/test/terraform-test-security.yml

pool:
  name: MultiOsPool
  demands:
    - Agent.Name -equals prod-win-vm-age

variables:
  terraformVersion: '1.15.9'
  terraformWorkingDirectory: 'environments/test/security'
  serviceConnection: 'sc-ealz-test'

  backendResourceGroup: 'rg-ealz-tfstate-eus2-001'
  backendStorageAccount: 'stealztfstate001'
  backendContainer: 'tfstate'
  backendKey: 'test-security.tfstate'

stages:

  - stage: PRValidation
    displayName: Terraform PR Validation
    condition: eq(variables['Build.Reason'], 'PullRequest')

    jobs:
      - job: TerraformValidation
        displayName: Terraform Validate and Plan

        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '$(terraformVersion)'

          - powershell: |
              terraform fmt -check -recursive -diff
            displayName: Terraform Format Check
            workingDirectory: '$(Build.SourcesDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(terraformWorkingDirectory)'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmUseEntraIdForAuthentication: true
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'
              commandOptions: '-input=false'

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-out=tfplan -input=false'

          - powershell: |
              terraform show -no-color tfplan | Out-File -FilePath tfplan.txt -Encoding utf8
            displayName: Generate Readable Terraform Plan
            workingDirectory: '$(terraformWorkingDirectory)'

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform Plan
            inputs:
              targetPath: '$(terraformWorkingDirectory)/tfplan'
              artifact: 'terraform-pr-security-plan'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: Publish Readable Terraform Plan
            inputs:
              targetPath: '$(terraformWorkingDirectory)/tfplan.txt'
              artifact: 'terraform-pr-security-plan-readable'
              publishLocation: 'pipeline'

  - stage: Plan
    displayName: Terraform Plan
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')

    jobs:
      - job: TerraformPlan
        displayName: Terraform Plan

        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '$(terraformVersion)'

          - powershell: |
              terraform fmt -check -recursive -diff
            displayName: Terraform Format Check
            workingDirectory: '$(Build.SourcesDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(terraformWorkingDirectory)'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmUseEntraIdForAuthentication: true
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'
              commandOptions: '-input=false'

          - task: TerraformTaskV4@4
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-out=tfplan -input=false'

          - task: PublishPipelineArtifact@1
            displayName: Publish Terraform Plan
            inputs:
              targetPath: '$(terraformWorkingDirectory)/tfplan'
              artifact: 'terraform-security-plan'
              publishLocation: 'pipeline'

  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    condition: and(succeeded('Plan'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    jobs:
      - deployment: TerraformApply
        displayName: Terraform Apply
        environment: 'test'

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: '$(terraformVersion)'

                - task: DownloadPipelineArtifact@2
                  displayName: Download Terraform Plan
                  inputs:
                    artifact: 'terraform-security-plan'
                    path: '$(terraformWorkingDirectory)'

                - task: TerraformTaskV4@4
                  displayName: Terraform Init
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(terraformWorkingDirectory)'
                    backendServiceArm: '$(serviceConnection)'
                    backendAzureRmUseEntraIdForAuthentication: true
                    backendAzureRmResourceGroupName: '$(backendResourceGroup)'
                    backendAzureRmStorageAccountName: '$(backendStorageAccount)'
                    backendAzureRmContainerName: '$(backendContainer)'
                    backendAzureRmKey: '$(backendKey)'
                    commandOptions: '-input=false'

                - task: TerraformTaskV4@4
                  displayName: Terraform Apply
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(terraformWorkingDirectory)'
                    environmentServiceNameAzureRM: '$(serviceConnection)'
                    commandOptions: 'tfplan'