trigger: none

pr: none

pool:
  name: MultiOsPool
  demands:
    - Agent.Name -equals prod-win-vm-age

variables:
  terraformVersion: '1.15.9'
  serviceConnection: 'sc-ealz-dev'

  currentWorkingDirectory: 'environments/dev'

  backendResourceGroup: 'rg-ealz-tfstate-eus2-001'
  backendStorageAccount: 'stealztfstate001'
  backendContainer: 'tfstate'
  backendKey: 'dev.tfstate'

stages:

  # ============================================================
  # Stage 1: Backup and verify current monolithic state
  # ============================================================

  - stage: BackupAndVerify
    displayName: Backup and Verify Existing State

    jobs:
      - job: BackupState
        displayName: Backup Existing dev.tfstate

        steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: Terraform Init - Existing State
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(currentWorkingDirectory)'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmUseEntraIdForAuthentication: true
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'
              commandOptions: '-input=false'

          - powershell: |
              Write-Host "Checking Resource Group state address..."
              terraform state list | Select-String "module.rg"
            displayName: Verify Resource Group State Address
            workingDirectory: '$(Build.SourcesDirectory)/$(currentWorkingDirectory)'

          - powershell: |
              $backupPath = "$(Build.ArtifactStagingDirectory)\dev-state-backup-before-refactor.json"

              Write-Host "Creating state backup..."
              terraform state pull | Out-File -FilePath $backupPath -Encoding utf8

              if (-not (Test-Path $backupPath)) {
                Write-Error "State backup was not created."
                exit 1
              }

              Write-Host "State backup created successfully:"
              Write-Host $backupPath

              Get-Item $backupPath | Format-List Name,Length,FullName
            displayName: Backup Existing Terraform State
            workingDirectory: '$(Build.SourcesDirectory)/$(currentWorkingDirectory)'

          - task: PublishPipelineArtifact@1
            displayName: Publish State Backup
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/dev-state-backup-before-refactor.json'
              artifact: 'dev-state-backup-before-refactor'
              publishLocation: 'pipeline'

  # ============================================================
  # Stage 2: Remove RG from old state
  #
  # IMPORTANT:
  # This changes the existing dev.tfstate.
  # It does NOT delete the Azure Resource Group.
  # ============================================================

  - stage: RemoveResourceGroupFromOldState
    displayName: Remove Resource Group From Old State

    dependsOn: BackupAndVerify
    condition: succeeded()

    jobs:
      - job: RemoveResourceGroup
        displayName: Remove Resource Group State Entry

        steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: Terraform Init - Existing State
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(currentWorkingDirectory)'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmUseEntraIdForAuthentication: true
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'
              commandOptions: '-input=false'

          - powershell: |
              Write-Host "Resource Group state before removal:"
              terraform state list | Select-String "module.rg"

              Write-Host ""
              Write-Host "Removing only:"
              Write-Host "module.rg.azurerm_resource_group.rg"
            displayName: Verify State Before Removal
            workingDirectory: '$(Build.SourcesDirectory)/$(currentWorkingDirectory)'

          - powershell: |
              terraform state rm "module.rg.azurerm_resource_group.rg"

              if ($LASTEXITCODE -ne 0) {
                Write-Error "terraform state rm failed."
                exit 1
              }
            displayName: Remove Resource Group From Old State
            workingDirectory: '$(Build.SourcesDirectory)/$(currentWorkingDirectory)'

          - powershell: |
              Write-Host "Resource Group state after removal:"

              $result = terraform state list | Select-String "module.rg"

              if ($result) {
                Write-Error "Resource Group state entry still exists."
                exit 1
              }

              Write-Host "Confirmed: module.rg is no longer present in dev.tfstate."
            displayName: Verify Resource Group Removed
            workingDirectory: '$(Build.SourcesDirectory)/$(currentWorkingDirectory)'