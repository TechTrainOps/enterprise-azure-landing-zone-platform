trigger:
  branches:
    include:
      - main
  paths:
    include:
      - environments/prod/governance/**
      - modules/governance/**
      - pipelines/prod/terraform-prod-governance.yml
      - pipelines/templates/**

pr:
  autoCancel: true
  branches:
    include:
      - main
  paths:
    include:
      - environments/prod/governance/**
      - modules/governance/**
      - pipelines/prod/terraform-prod-governance.yml
      - pipelines/templates/**

pool:
  name: MultiOsPool
  demands:
    - Agent.Name -equals prod-win-vm-age

stages:
  - template: ../templates/terraform-domain.yml
    parameters:
      environmentName: prod
      domainName: governance
      terraformWorkingDirectory: environments/prod/governance
      serviceConnection: sc-ealz-prod
      backendResourceGroup: rg-ealz-tfstate-eus2-001
      backendStorageAccount: stealztfstate001
      backendContainer: tfstate
      backendKey: prod-governance.tfstate
      deploymentEnvironment: prod